name: Artwork submissions
on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 已合并但需要重新处理的投稿 PR 编号
        required: true
permissions: {}
jobs:
  validate:
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - run: node tools/github.mjs validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - run: node tools/github.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
